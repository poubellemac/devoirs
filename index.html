<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Conjugaison - Kelvin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bleu: #2b6cb0;
    --bleu-fonce: #1a365d;
    --jaune: #f6c343;
    --vert: #2f9e44;
    --rouge: #e03131;
    --fond: #eef4fb;
    --carte: #ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: var(--fond);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:480px;
    padding:16px;
    padding-bottom:60px;
  }
  header{
    text-align:center;
    padding:18px 10px;
    background: var(--bleu-fonce);
    color:white;
    border-radius:18px;
    margin-bottom:16px;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
  }
  header p{
    margin:4px 0 0;
    font-size:0.85rem;
    opacity:0.75;
  }
  .carte{
    background: var(--carte);
    border-radius:18px;
    padding:20px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    margin-bottom:16px;
  }
  .temps-badge{
    display:inline-block;
    background: var(--jaune);
    color:#5c4400;
    font-weight:bold;
    padding:4px 12px;
    border-radius:20px;
    font-size:0.85rem;
    margin-bottom:12px;
  }
  .consigne{
    text-align:center;
    font-size:0.9rem;
    color:#555;
    margin-bottom:14px;
  }
  .phrase{
    font-size:1.25rem;
    line-height:1.6;
    margin-bottom:18px;
  }
  .verbe-infinitif{
    color: var(--bleu);
    font-weight:bold;
  }
  .qcm-groupe{
    margin-bottom:16px;
  }
  .qcm-label{
    font-size:0.9rem;
    color:#555;
    margin-bottom:6px;
    font-weight:bold;
  }
  .qcm-options{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .qcm-btn-small{
    flex:1;
    min-width:60px;
    padding:7px 4px;
    border:2px solid #ccc;
    border-radius:9px;
    background:white;
    font-size:0.72rem;
    cursor:pointer;
    text-align:center;
  }
  .qcm-btn-small.selected{
    border-color: var(--bleu);
    background:#e7f0fb;
    color: var(--bleu-fonce);
    font-weight:bold;
  }
  input[type="text"]{
    width:100%;
    padding:12px;
    font-size:1.1rem;
    border:2px solid #ccc;
    border-radius:12px;
    margin-bottom:12px;
    font-family:inherit;
  }
  .boutons{
    display:flex;
    gap:10px;
  }
  button.action{
    flex:1;
    padding:14px;
    border:none;
    border-radius:14px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    color:white;
  }
  .btn-valider{background: var(--bleu);}
  .btn-aide{background:#868e96;}
  .feedback{
    margin-top:14px;
    padding:12px;
    border-radius:12px;
    font-size:1rem;
    display:none;
  }
  .feedback.ok{background:#d3f9d8; color:#2b8a3e; display:block;}
  .feedback.non{background:#ffe3e3; color:#c92a2a; display:block;}
  .feedback.accent{background:#fff3bf; color:#8a6d00; display:block;}
  .indice{
    margin-top:10px;
    padding:10px;
    background:#f1f3f5;
    border-left:4px solid var(--jaune);
    border-radius:8px;
    font-size:0.95rem;
    display:none;
  }
  .indice.visible{display:block;}
  #ecran-fin{
    display:none;
    text-align:center;
  }
  #ecran-fin h2{color:var(--bleu-fonce);}
  .rejouer{
    background: var(--vert);
    color:white;
    border:none;
    padding:14px 20px;
    border-radius:14px;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>✏️ Conjugaison</h1>
    <p>V4</p>
  </header>

  <div id="ecran-jeu">
    <div class="consigne">Réponds aux 10 questions</div>

    <div class="carte">
      <div class="temps-badge" id="badge-temps">Présent</div>
      <div class="phrase" id="phrase-texte"></div>

      <input type="text" id="reponse-input" placeholder="Écris le verbe ici..." autocomplete="off">

      <div class="qcm-groupe" id="zone-qcm-genre-nombre" style="opacity:0.4; pointer-events:none;">
        <div class="qcm-label" id="label-qcm-genre-nombre">Masculin, féminin, singulier ou pluriel ? (désactivé pour le moment)</div>
        <div class="qcm-options" id="qcm-genre-nombre">
          <div class="qcm-btn-small" data-type="genre" data-val="m">Masculin</div>
          <div class="qcm-btn-small" data-type="genre" data-val="f">Féminin</div>
          <div class="qcm-btn-small" data-type="nombre" data-val="s">Singulier</div>
          <div class="qcm-btn-small" data-type="nombre" data-val="p">Pluriel</div>
        </div>
      </div>


      <div class="boutons" id="zone-boutons">
        <button class="action btn-aide" onclick="toggleAide()">💡 Aide</button>
        <button class="action btn-valider" id="btn-valider" onclick="valider()">Valider</button>
      </div>
      <button class="action btn-valider" id="btn-suivant" onclick="questionSuivante()" style="display:none; width:100%; margin-top:10px;">Suivant ➡️</button>
      <button class="action" onclick="finDuJeu()" style="width:100%; margin-top:10px; background:#adb5bd; font-size:0.8rem;">⏭️ Terminer maintenant (test — à retirer avant usage réel)</button>

      <div class="indice" id="zone-indice"></div>
      <div class="feedback" id="zone-feedback"></div>
    </div>
  </div>

  <div id="ecran-fin">
    <div class="carte">
      <h2>🎉 Terminé !</h2>
      <p>Bravo, tu as répondu correctement aux 10 questions !</p>
      <button class="rejouer" onclick="recommencer()">Recommencer</button>
    </div>
  </div>

</div>

<script>
const verbes = [
  {
    infinitif: "manger", groupe: 1, complement: "une pomme",
    present:   ["mange", "manges", "mange", "mangeons", "mangez", "mangent"],
    futur:     ["mangerai", "mangeras", "mangera", "mangerons", "mangerez", "mangeront"],
    imparfait: ["mangeais", "mangeais", "mangeait", "mangions", "mangiez", "mangeaient"],
    passeCompose: { aux:"avoir", participe:"mangé" }
  },
  {
    infinitif: "regarder", groupe: 1, complement: "la télé",
    present:   ["regarde", "regardes", "regarde", "regardons", "regardez", "regardent"],
    futur:     ["regarderai", "regarderas", "regardera", "regarderons", "regarderez", "regarderont"],
    imparfait: ["regardais", "regardais", "regardait", "regardions", "regardiez", "regardaient"],
    passeCompose: { aux:"avoir", participe:"regardé" }
  },
  {
    infinitif: "finir", groupe: 2, complement: "ses devoirs",
    present:   ["finis", "finis", "finit", "finissons", "finissez", "finissent"],
    futur:     ["finirai", "finiras", "finira", "finirons", "finirez", "finiront"],
    imparfait: ["finissais", "finissais", "finissait", "finissions", "finissiez", "finissaient"],
    passeCompose: { aux:"avoir", participe:"fini" }
  },
  {
    infinitif: "grandir", groupe: 2, complement: "vite",
    present:   ["grandis", "grandis", "grandit", "grandissons", "grandissez", "grandissent"],
    futur:     ["grandirai", "grandiras", "grandira", "grandirons", "grandirez", "grandiront"],
    imparfait: ["grandissais", "grandissais", "grandissait", "grandissions", "grandissiez", "grandissaient"],
    passeCompose: { aux:"avoir", participe:"grandi" }
  },
  {
    infinitif: "faire", groupe: 3, complement: "un gâteau",
    present:   ["fais", "fais", "fait", "faisons", "faites", "font"],
    futur:     ["ferai", "feras", "fera", "ferons", "ferez", "feront"],
    imparfait: ["faisais", "faisais", "faisait", "faisions", "faisiez", "faisaient"],
    passeCompose: { aux:"avoir", participe:"fait" }
  },
  {
    infinitif: "venir", groupe: 3, complement: "à la fête",
    present:   ["viens", "viens", "vient", "venons", "venez", "viennent"],
    futur:     ["viendrai", "viendras", "viendra", "viendrons", "viendrez", "viendront"],
    imparfait: ["venais", "venais", "venait", "venions", "veniez", "venaient"],
    passeCompose: { aux:"etre", participe:"venu" }
  }
];

const sujets = [
  {mot:"je",    index:0, nombre:"s", genre:"amb"},
  {mot:"tu",    index:1, nombre:"s", genre:"m"},
  {mot:"il",    index:2, nombre:"s", genre:"m"},
  {mot:"elle",  index:2, nombre:"s", genre:"f"},
  {mot:"nous",  index:3, nombre:"p", genre:"amb"},
  {mot:"vous",  index:4, nombre:"p", genre:"amb"},
  {mot:"ils",   index:5, nombre:"p", genre:"m"},
  {mot:"elles", index:5, nombre:"p", genre:"f"}
];

const temps = [
  { cle:"present", nom:"Présent", indiceMot:"Maintenant" },
  { cle:"futur", nom:"Futur", indiceMot:"Demain" },
  { cle:"imparfait", nom:"Imparfait", indiceMot:"Autrefois" },
  { cle:"passeCompose", nom:"Passé composé", indiceMot:"Hier" }
];

let file = [];
let genreChoisi = null;
let nombreChoisi = null;
const NB_QUESTIONS = 10;

function melanger(tableau){
  const t = tableau.slice();
  for(let i = t.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [t[i], t[j]] = [t[j], t[i]];
  }
  return t;
}

function creerQuestionAvecVerbe(verbe){
  const tempsChoisi = temps[Math.floor(Math.random()*temps.length)];
  const sujet = sujets[Math.floor(Math.random()*sujets.length)];
  return { verbe, tempsChoisi, sujet, retry:false };
}

function eviterRepetitionsConsecutives(liste){
  for(let i=1; i<liste.length; i++){
    if(liste[i].infinitif === liste[i-1].infinitif){
      for(let j=i+1; j<liste.length; j++){
        if(liste[j].infinitif !== liste[i-1].infinitif){
          [liste[i], liste[j]] = [liste[j], liste[i]];
          break;
        }
      }
    }
  }
  return liste;
}

function genererFile(){
  // sac de verbes mélangé pour une rotation équilibrée, pas de hasard pur
  let sac = [];
  while(sac.length < NB_QUESTIONS){
    sac = sac.concat(melanger(verbes));
  }
  sac = melanger(sac).slice(0, NB_QUESTIONS);
  sac = eviterRepetitionsConsecutives(sac);
  file = sac.map(v => creerQuestionAvecVerbe(v));
}

function formePassecompose(verbe, indexConj, genreAccord, pluriel){
  const aux = verbe.passeCompose.aux;
  const auxForme = aux === "avoir"
    ? ["ai","as","a","avons","avez","ont"][indexConj]
    : ["suis","es","est","sommes","êtes","sont"][indexConj];
  let participe = verbe.passeCompose.participe;
  if(aux === "etre"){
    if(genreAccord === "f" && pluriel) participe += "es";
    else if(genreAccord === "f") participe += "e";
    else if(pluriel) participe += "s";
  }
  return auxForme + " " + participe;
}

function formeAttendue(verbe, tempsCle, sujet, genreAccord){
  if(tempsCle === "passeCompose"){
    return formePassecompose(verbe, sujet.index, genreAccord, sujet.nombre==="p");
  }
  return verbe[tempsCle][sujet.index];
}

function afficherQuestion(){
  if(file.length === 0){
    finDuJeu();
    return;
  }
  const q = file[0];
  document.getElementById("badge-temps").textContent = q.tempsChoisi.nom;
  document.getElementById("phrase-texte").innerHTML =
    "<b>" + q.sujet.mot + "</b> ______ " +
    "<span class='verbe-infinitif'>(" + q.verbe.infinitif + ")</span> " +
    q.verbe.complement + ".";

  document.getElementById("reponse-input").value = "";
  document.getElementById("zone-feedback").className = "feedback";
  document.getElementById("zone-feedback").textContent = "";
  document.getElementById("zone-indice").className = "indice";
  document.getElementById("btn-valider").style.display = "inline-block";
  document.getElementById("btn-suivant").style.display = "none";
  document.getElementById("reponse-input").disabled = false;
  document.getElementById("reponse-input").focus();
  genreChoisi = null;
  nombreChoisi = null;
  document.querySelectorAll("#qcm-genre-nombre .qcm-btn-small").forEach(b=>b.classList.remove("selected"));

  const zoneQcm = document.getElementById("zone-qcm-genre-nombre");
  const labelQcm = document.getElementById("label-qcm-genre-nombre");
  if(q.retry){
    zoneQcm.style.opacity = "1";
    zoneQcm.style.pointerEvents = "auto";
    labelQcm.textContent = "Masculin, féminin, singulier ou pluriel ?";
  } else {
    zoneQcm.style.opacity = "0.4";
    zoneQcm.style.pointerEvents = "none";
    labelQcm.textContent = "Masculin, féminin, singulier ou pluriel ? (désactivé pour le moment)";
  }

  const exempleForme = formeAttendue(q.verbe, q.tempsChoisi.cle, sujets[0], "m");
  document.getElementById("zone-indice").innerHTML =
    "💡 Exemple : <i>" + q.tempsChoisi.indiceMot + ", je " + exempleForme + " " + q.verbe.complement + ".</i>";
}

function toggleAide(){
  document.getElementById("zone-indice").classList.toggle("visible");
}

document.getElementById("qcm-genre-nombre").addEventListener("click", function(e){
  if(!e.target.classList.contains("qcm-btn-small")) return;
  const type = e.target.dataset.type;
  document.querySelectorAll("#qcm-genre-nombre .qcm-btn-small[data-type='"+type+"']").forEach(b=>b.classList.remove("selected"));
  e.target.classList.add("selected");
  if(type === "genre") genreChoisi = e.target.dataset.val;
  if(type === "nombre") nombreChoisi = e.target.dataset.val;
});

function retirerAccents(str){
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

const SUPABASE_URL = "https://ommdbhxgzwcaalsnvhup.supabase.co";
const SUPABASE_KEY = "sb_publishable_s9Yp5QKlKchL6E7RU4yAaw_VDblnXgy";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function enregistrerErreur(q, reponseDonnee, reponseAttendue){
  try{
    const { error } = await supabaseClient.from("erreurs").insert({
      infinitif: q.verbe.infinitif,
      temps: q.tempsChoisi.cle,
      sujet: q.sujet.mot,
      reponse_donnee: reponseDonnee,
      reponse_attendue: reponseAttendue
    });
    if(error) console.error("Erreur Supabase :", error);
  } catch(e){
    console.error("Erreur réseau Supabase :", e);
  }
}

let derniereQuestionReussie = false;

function valider(){
  const q = file[0];
  const feedback = document.getElementById("zone-feedback");

  let qcmOk = true;
  let genreAccord = q.sujet.genre === "amb" ? "m" : q.sujet.genre;

  if(q.retry){
    if(!nombreChoisi || !genreChoisi){
      feedback.className = "feedback non";
      feedback.textContent = "⚠️ Choisis d'abord le genre et le nombre.";
      return;
    }
    genreAccord = q.sujet.genre === "amb" ? genreChoisi : q.sujet.genre;
    const nombreOk = nombreChoisi === q.sujet.nombre;
    const genreOk = q.sujet.genre === "amb" ? true : (genreChoisi === q.sujet.genre);
    qcmOk = nombreOk && genreOk;
  }

  const reponse = document.getElementById("reponse-input").value.trim().toLowerCase();
  const attendu = formeAttendue(q.verbe, q.tempsChoisi.cle, q.sujet, genreAccord).toLowerCase();
  const reponseSansAccent = retirerAccents(reponse);
  const attenduSansAccent = retirerAccents(attendu);

  let reussi = false;

  if(reponse === attendu && qcmOk){
    reussi = true;
    feedback.className = "feedback ok";
    feedback.textContent = "✅ Bravo, c'est juste !";
  } else if(reponseSansAccent === attenduSansAccent && qcmOk){
    reussi = true;
    feedback.className = "feedback accent";
    feedback.textContent = "🟡 Presque ! Il manque des accents. La bonne réponse : " + attendu;
  } else {
    feedback.className = "feedback non";
    feedback.textContent = "❌ Pas encore ! Réponse attendue : " + attendu + " (cette question reviendra plus tard)";
    enregistrerErreur(q, reponse, attendu);
  }

  derniereQuestionReussie = reussi;
  document.getElementById("reponse-input").disabled = true;
  document.getElementById("btn-valider").style.display = "none";
  document.getElementById("btn-suivant").style.display = "block";
}

function questionSuivante(){
  const q = file.shift();
  if(!derniereQuestionReussie){
    q.retry = true;
    file.push(q);
    // éviter que le verbe qu'on vient de rater revienne juste après lui-même
    if(file.length > 0 && file[0].verbe.infinitif === q.verbe.infinitif){
      for(let j=1; j<file.length; j++){
        if(file[j].verbe.infinitif !== q.verbe.infinitif){
          [file[0], file[j]] = [file[j], file[0]];
          break;
        }
      }
    }
  }
  afficherQuestion();
}

async function finDuJeu(){
  document.getElementById("ecran-jeu").style.display = "none";
  document.getElementById("ecran-fin").style.display = "block";

  const dansTrenteMin = new Date(Date.now() + 30*60*1000).toISOString();
  try{
    const { error } = await supabaseClient
      .from("etat_deverrouillage")
      .upsert({ id: 1, deverrouille_jusqu_a: dansTrenteMin });
    if(error) console.error("Erreur enregistrement déverrouillage :", error);
  } catch(e){
    console.error("Erreur réseau déverrouillage :", e);
  }
}

function recommencer(){
  genererFile();
  document.getElementById("ecran-jeu").style.display = "block";
  document.getElementById("ecran-fin").style.display = "none";
  afficherQuestion();
}

genererFile();
afficherQuestion();
</script>

</body>
</html>
